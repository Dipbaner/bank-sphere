spring.application.name=bank_sphere

spring.datasource.url=jdbc:mysql://localhost:3306/banksphere
spring.datasource.username=root
spring.datasource.password=dip220804

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080

# Mail (Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# App settings
app.mail.from=${MAIL_USERNAME:no-reply@banksphere.local}
app.base-url=http://localhost:8080
app.verification.expiry-hours=24

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=banksphere
app.jwt.preauth-minutes=5
app.jwt.access-minutes=15

spring.profiles.active=dev

app.security.max-failed-attempts=5
app.security.lock-minutes=15

app.totp.issuer=BankSphere

app.otp.encryption-key=${OTP_ENC_KEY}
app.otp.max-attempts=5
app.otp.backup-code-count=10

app.jwt.refresh-days=7
app.jwt.session-max-days=30

app.frontend-url=http://localhost:5173
app.password-reset.expiry-minutes=15
app.password-reset.cooldown-seconds=60
app.password.history-count=3

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:not-configured}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

app.oauth2.success-redirect=http://localhost:5173/oauth2/callback
app.oauth2.failure-redirect=http://localhost:5173/login

app.cookie.secure=false
app.auth.refresh-in-body=false

app.transaction.max-amount=1000000.00
app.transaction.daily-debit-limit=100000.00